server:
  port: 8081  # 后端项目端口
  servlet:
    context-path: /api  # 接口统一前缀

spring:
  profiles:
    active: dev  # 开发环境（保留这行）
    # active: prod  # 生产环境（注释掉，需要时再打开）

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/shopping_db?characterEncoding=utf-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Jw52629043826697  # 你的MySQL密码

  redis:
    host: localhost
    port: 6379
    # 生产必须加
    password:
    database: 0
    connect-timeout: 10s
    timeout: 10s
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms


mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 开启下划线驼峰 自动映射
    map-underscore-to-camel-case: true

# 快递鸟(查询物流信息)
